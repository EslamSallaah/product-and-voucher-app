<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add product | Product Store</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/products}">Product Store</a>
    <a class="button secondary" th:href="@{/products}">Back to products</a>
</header>
<main class="auth-card form-card">
    <p class="eyebrow">ADMIN</p>
    <h1>Add a product</h1>
    <div class="notice error" th:if="${productError}" th:text="${productError}"></div>
    <form th:action="@{/products}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="name">Product name</label>
        <input id="name" name="name" maxlength="160" required>
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" maxlength="2000" required></textarea>
        <label for="price">Price</label>
        <input id="price" name="price" type="number" min="0.01" step="0.01" required>
        <button type="submit">Save product</button>
    </form>
</main>
</body>
</html>
