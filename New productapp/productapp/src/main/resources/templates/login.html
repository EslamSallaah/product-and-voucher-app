<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Product Store</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <p class="eyebrow">PRODUCT STORE</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in with the email and password you use for the voucher app.</p>
    <div class="notice error" th:if="${param.error}">Email or password is incorrect.</div>
    <div class="notice" th:if="${param.logout}">You have signed out.</div>
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Email</label>
        <input id="username" name="username" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
