<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <main class="auth-shell">
        <section class="card auth-card">
            <p class="eyebrow">Voucher app</p>
            <h1>Create your account</h1>
            <p class="intro">Sign up to look up and redeem vouchers.</p>
            <p class="message" id="message" role="alert"></p>
            <form action="/register" method="post">
                <label>
                    First name
                    <input name="name" autocomplete="given-name" required>
                </label>
                <label>
                    Last name
                    <input name="lastname" autocomplete="family-name" required>
                </label>
                <label>
                    Email
                    <input name="email" type="email" autocomplete="email" required>
                </label>
                <label>
                    Password (at least 8 characters)
                    <input name="password" type="password" autocomplete="new-password" minlength="8" required>
                </label>
                <button type="submit">Create account</button>
            </form>
            <p class="secondary-link">Already have an account? <a href="/login.html">Sign in</a></p>
        </section>
    </main>
    <script>
        const messages = {
            invalid: "Enter your name, a valid email address, and a password of at least 8 characters.",
            exists: "An account with that email already exists."
        };
        const error = new URLSearchParams(window.location.search).get("error");
        if (error && messages[error]) {
            document.getElementById("message").textContent = messages[error];
        }
    </script>
</body>
</html>
